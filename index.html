<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>EduTrackS</title>
<link rel="preload" href="sql-wasm.js" as="script">
<link rel="preload" href="chart.umd.min.js" as="script">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2352">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EduTrackS">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1e293b}
  body{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b2352,#1d4ed8);padding:16px}
  .card{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:100%;max-width:380px;padding:32px 28px;text-align:center}
  .logo{width:56px;height:56px;border-radius:14px;background:#1e40af;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  h1{font-size:18px;margin:0}
  p.sub{margin:6px 0 20px;font-size:13px;color:#64748b}
  input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;text-align:center;font-size:22px;letter-spacing:6px;margin-bottom:10px;outline:none}
  input:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.15)}
  #err{color:#dc2626;font-size:13px;min-height:18px;margin-bottom:10px}
  #err.info{color:#475569}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:#1e40af;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .foot{margin-top:18px;font-size:11px;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
  <h1>EduTrackS</h1>
  <p class="sub">Enter your PIN to continue</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off" autofocus>
  <div id="err"></div>
  <button id="go">Unlock</button>
  <div class="foot">© HABINEZA Jean Claude · EduTrackS. All rights reserved.</div>
</div>
<script>
(function () {
  try { sessionStorage.removeItem('es_session'); } catch (e) {}
  var pinEl = document.getElementById('pin'), errEl = document.getElementById('err'), btn = document.getElementById('go');
  try { fetch('/api/login?warm=1', { cache: 'no-store' }).catch(function () {}); } catch (e) {}
  // Same 13 table reads + settings read the app makes on start-up (order matters: the app reads them by position).
  var PRE_TABLES = ["classes","subjects","teachers","teacher_subjects","class_tutors","teacher_classes","students","settings","marks","commitments","student_groups","student_commitments","class_history"];
  function prefetchData(token) {
    try {
      var reqs = PRE_TABLES.map(function (t) { return { type: 'execute', stmt: { sql: 'SELECT * FROM ' + t, args: [] } }; });
      reqs.push({ type: 'execute', stmt: { sql: "SELECT key, value FROM settings WHERE key IN ('active_academic_year', 'active_term')", args: [] } });
      reqs.push({ type: 'close' });
      return fetch('/api/turso', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ requests: reqs }) })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { return j && Array.isArray(j.results) && !j.results.some(function (x) { return x.type === 'error'; }) ? j : null; })
        .catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }
  function fail(msg) { errEl.className = ''; errEl.textContent = msg; btn.disabled = false; pinEl.value = ''; pinEl.focus(); }
  async function login() {
    var pin = pinEl.value.trim();
    if (!pin) { fail('Enter your PIN.'); return; }
    var t0 = Date.now(), preDoneAt = 0;
    btn.disabled = true; errEl.className = 'info'; errEl.textContent = 'Verifying…';
    var slow = setTimeout(function () { if (btn.disabled) errEl.textContent = 'Waking up the server… the first login can take a few seconds.'; }, 3000);
    try {
      var res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: pin }) });
      var raw = await res.text(), data = {};
      try { data = JSON.parse(raw); } catch (e) {}
      if (!res.ok || !data.ok || !data.token) {
        clearTimeout(slow);
        if (res.status === 401) fail((data && data.error) || 'Incorrect PIN. Try again.');
        else fail(((data && data.error) || 'The server did not answer correctly') + ' [login HTTP ' + res.status + ']');
        return;
      }
      var tLogin = Date.now();
      errEl.textContent = 'Loading your workspace…';
      var pre = prefetchData(data.token).then(function (v) { preDoneAt = Date.now(); return v; });   // v111: school data downloads at the same time as the app
      var ar = await fetch('/api/app', { headers: { 'Authorization': 'Bearer ' + data.token }, cache: 'no-store' });
      if (!ar.ok) { clearTimeout(slow); fail('Signed in, but the app could not be loaded [app HTTP ' + ar.status + ']. Check that api/app.js is deployed.'); return; }
      var html = await ar.text();
      var preRes = await Promise.race([pre, new Promise(function (r) { setTimeout(function () { r(null); }, 2500); })]);
      window.__ES_PRE = preRes ? { t: Date.now(), r: preRes } : null;
      try { sessionStorage.setItem('es_timing', JSON.stringify({ t0: t0, login: tLogin, app: Date.now(), data: preRes ? preDoneAt : 0 })); } catch (e) {}
      sessionStorage.setItem('es_session', JSON.stringify({ token: data.token, role: data.role, teacherId: data.teacherId, name: data.name, subjects: data.subjects || [], tutorClass: data.tutorClass == null ? null : data.tutorClass, classes: data.classes || [] }));
      clearTimeout(slow);
      document.open(); document.write(html); document.close();
    } catch (e) {
      clearTimeout(slow);
      fail('Could not reach the server. Check your internet and try again.');
    }
  }
  btn.addEventListener('click', login);
  pinEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
})();
</script>
<script>
// v109: start downloading the 2 libraries the app needs to OPEN right away (not after 1.5 s),
// and keep the big Excel/PDF tools for later so they don't slow the login on a weak connection.
(function(){
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){}); }catch(e){}
  ['sql-wasm.js','sql-wasm.wasm','chart.umd.min.js'].forEach(function(f){ try{ fetch(f,{priority:'high'}).catch(function(){}); }catch(e){} });
  window.addEventListener('load',function(){
    setTimeout(function(){ ['xlsx.full.min.js','jspdf.umd.min.js','jspdf.plugin.autotable.min.js'].forEach(function(f){ try{ fetch(f,{priority:'low'}).catch(function(){}); }catch(e){} }); },4000);
  });
})();
</script>
</body>
</html>
